<!doctype html>
<html lang="en" data-motion="full" data-draw="stroke" data-finish="metal" data-metal="gold" data-glint="on">
<head>
  <meta charset="utf-8">
  <title>Teletraan I</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="themes/hawktimus.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="frame.css">
</head>
<body>
  <!-- The metal kit. The gradients and the screw are drawn here once, and every
       frame points at them with <use>. The colours are the --metal and --red
       tokens in tokens.css. A gradient takes its colours from the place it
       sits in the page and not from the shape that uses it, so the three edge
       gradients below carry data-metal="gold", and plate.js makes a silver copy
       of each (data-metal="silver") the first time it draws a frame. tokens.css
       points a frame at the gradients of its own metal, so the page frames can
       be gold or silver while the banner keeps the metal of Frame metal.
       plate.js adds each frame's shapes to the empty group at the end, the first
       time that kind of frame is built. Nothing here is shown by itself. -->
  <svg class="metal-defs" width="0" height="0" aria-hidden="true">
    <defs>
      <!-- The face of an edge: banded light and dark, like polished metal. The
           stops are uneven on purpose, with narrow dark and bright streaks and
           a few streaks of grime, so it looks worn and not new. The numbers are
           the --metal colours in tokens.css: 1 is the brightest and 5 the
           darkest. The gradient is measured from the top left corner of the
           drawing it is used in, so the edges of one frame carry on the same
           bands. It repeats by reflecting, so it never shows a seam. -->
      <linearGradient id="edge-gold" data-metal="gold" gradientUnits="userSpaceOnUse" spreadMethod="reflect" x1="0" y1="0" x2="420" y2="260">
        <stop offset="0" style="stop-color: var(--metal-1)"/>
        <stop offset=".03" style="stop-color: var(--metal-2)"/>
        <stop offset=".05" style="stop-color: var(--metal-3)"/>
        <stop offset=".058" style="stop-color: var(--metal-3)"/>
        <stop offset=".06" style="stop-color: var(--metal-5)"/>
        <stop offset=".064" style="stop-color: var(--metal-3)"/>
        <stop offset=".1" style="stop-color: var(--metal-3)"/>
        <stop offset=".108" style="stop-color: var(--metal-grime)"/>
        <stop offset=".122" style="stop-color: var(--metal-grime)"/>
        <stop offset=".13" style="stop-color: var(--metal-3)"/>
        <stop offset=".14" style="stop-color: var(--metal-2)"/>
        <stop offset=".18" style="stop-color: var(--metal-7)"/>
        <stop offset=".22" style="stop-color: var(--metal-3)"/>
        <stop offset=".27" style="stop-color: var(--metal-4)"/>
        <stop offset=".3" style="stop-color: var(--metal-3)"/>
        <stop offset=".33" style="stop-color: var(--metal-2)"/>
        <stop offset=".345" style="stop-color: var(--metal-1)"/>
        <stop offset=".36" style="stop-color: var(--metal-3)"/>
        <stop offset=".4" style="stop-color: var(--metal-4)"/>
        <stop offset=".41" style="stop-color: var(--metal-grime)"/>
        <stop offset=".44" style="stop-color: var(--metal-grime)"/>
        <stop offset=".455" style="stop-color: var(--metal-4)"/>
        <stop offset=".47" style="stop-color: var(--metal-3)"/>
        <stop offset=".52" style="stop-color: var(--metal-4)"/>
        <stop offset=".56" style="stop-color: var(--metal-5)"/>
        <stop offset=".6" style="stop-color: var(--metal-6)"/>
        <stop offset=".62" style="stop-color: var(--metal-5)"/>
        <stop offset=".66" style="stop-color: var(--metal-4)"/>
        <stop offset=".7" style="stop-color: var(--metal-6)"/>
        <stop offset=".75" style="stop-color: var(--metal-3)"/>
        <stop offset=".78" style="stop-color: var(--metal-7)"/>
        <stop offset=".82" style="stop-color: var(--metal-3)"/>
        <stop offset=".86" style="stop-color: var(--metal-7)"/>
        <stop offset=".875" style="stop-color: var(--metal-grime)"/>
        <stop offset=".89" style="stop-color: var(--metal-grime)"/>
        <stop offset=".9" style="stop-color: var(--metal-4)"/>
        <stop offset=".92" style="stop-color: var(--metal-4)"/>
        <stop offset=".95" style="stop-color: var(--metal-3)"/>
        <stop offset="1" style="stop-color: var(--metal-8)"/>
      </linearGradient>
      <linearGradient id="edge-red" gradientUnits="userSpaceOnUse" spreadMethod="reflect" x1="0" y1="0" x2="420" y2="260">
        <stop offset="0" style="stop-color: var(--red-1)"/>
        <stop offset=".03" style="stop-color: var(--red-2)"/>
        <stop offset=".05" style="stop-color: var(--red-3)"/>
        <stop offset=".058" style="stop-color: var(--red-3)"/>
        <stop offset=".06" style="stop-color: var(--red-5)"/>
        <stop offset=".064" style="stop-color: var(--red-3)"/>
        <stop offset=".1" style="stop-color: var(--red-3)"/>
        <stop offset=".108" style="stop-color: var(--red-grime)"/>
        <stop offset=".122" style="stop-color: var(--red-grime)"/>
        <stop offset=".13" style="stop-color: var(--red-3)"/>
        <stop offset=".14" style="stop-color: var(--red-2)"/>
        <stop offset=".18" style="stop-color: var(--red-7)"/>
        <stop offset=".22" style="stop-color: var(--red-3)"/>
        <stop offset=".27" style="stop-color: var(--red-4)"/>
        <stop offset=".3" style="stop-color: var(--red-3)"/>
        <stop offset=".33" style="stop-color: var(--red-2)"/>
        <stop offset=".345" style="stop-color: var(--red-1)"/>
        <stop offset=".36" style="stop-color: var(--red-3)"/>
        <stop offset=".4" style="stop-color: var(--red-4)"/>
        <stop offset=".41" style="stop-color: var(--red-grime)"/>
        <stop offset=".44" style="stop-color: var(--red-grime)"/>
        <stop offset=".455" style="stop-color: var(--red-4)"/>
        <stop offset=".47" style="stop-color: var(--red-3)"/>
        <stop offset=".52" style="stop-color: var(--red-4)"/>
        <stop offset=".56" style="stop-color: var(--red-5)"/>
        <stop offset=".6" style="stop-color: var(--red-6)"/>
        <stop offset=".62" style="stop-color: var(--red-5)"/>
        <stop offset=".66" style="stop-color: var(--red-4)"/>
        <stop offset=".7" style="stop-color: var(--red-6)"/>
        <stop offset=".75" style="stop-color: var(--red-3)"/>
        <stop offset=".78" style="stop-color: var(--red-7)"/>
        <stop offset=".82" style="stop-color: var(--red-3)"/>
        <stop offset=".86" style="stop-color: var(--red-7)"/>
        <stop offset=".875" style="stop-color: var(--red-grime)"/>
        <stop offset=".89" style="stop-color: var(--red-grime)"/>
        <stop offset=".9" style="stop-color: var(--red-4)"/>
        <stop offset=".92" style="stop-color: var(--red-4)"/>
        <stop offset=".95" style="stop-color: var(--red-3)"/>
        <stop offset="1" style="stop-color: var(--red-8)"/>
      </linearGradient>

      <!-- The ridge, the bright line on the lit edge. It is a gradient at another
           angle than the face, and it fades in places, like polished metal that
           has been handled. -->
      <linearGradient id="edge-ridge-gold" data-metal="gold" gradientUnits="userSpaceOnUse" spreadMethod="reflect" x1="0" y1="0" x2="330" y2="150">
        <stop offset="0" style="stop-color: var(--metal-ridge)" stop-opacity="1"/>
        <stop offset=".12" style="stop-color: var(--metal-ridge)" stop-opacity=".45"/>
        <stop offset=".2" style="stop-color: var(--metal-2)" stop-opacity=".9"/>
        <stop offset=".34" style="stop-color: var(--metal-1)" stop-opacity="1"/>
        <stop offset=".46" style="stop-color: var(--metal-1)" stop-opacity=".35"/>
        <stop offset=".58" style="stop-color: var(--metal-3)" stop-opacity=".8"/>
        <stop offset=".74" style="stop-color: var(--metal-ridge)" stop-opacity="1"/>
        <stop offset=".82" style="stop-color: var(--metal-ridge)" stop-opacity=".5"/>
        <stop offset=".9" style="stop-color: var(--metal-2)" stop-opacity=".95"/>
        <stop offset="1" style="stop-color: var(--metal-ridge)" stop-opacity="1"/>
      </linearGradient>
      <linearGradient id="edge-ridge-red" gradientUnits="userSpaceOnUse" spreadMethod="reflect" x1="0" y1="0" x2="330" y2="150">
        <stop offset="0" style="stop-color: var(--red-ridge)" stop-opacity="1"/>
        <stop offset=".12" style="stop-color: var(--red-ridge)" stop-opacity=".45"/>
        <stop offset=".2" style="stop-color: var(--red-2)" stop-opacity=".9"/>
        <stop offset=".34" style="stop-color: var(--red-1)" stop-opacity="1"/>
        <stop offset=".46" style="stop-color: var(--red-1)" stop-opacity=".35"/>
        <stop offset=".58" style="stop-color: var(--red-3)" stop-opacity=".8"/>
        <stop offset=".74" style="stop-color: var(--red-ridge)" stop-opacity="1"/>
        <stop offset=".82" style="stop-color: var(--red-ridge)" stop-opacity=".5"/>
        <stop offset=".9" style="stop-color: var(--red-2)" stop-opacity=".95"/>
        <stop offset="1" style="stop-color: var(--red-ridge)" stop-opacity="1"/>
      </linearGradient>

      <!-- The shade, soft dark patches of grime on the lower half of the edge.
           The colour is the same everywhere. Only the opacity changes, so the
           patches fade in and out and are never the same length. -->
      <linearGradient id="edge-shade-gold" data-metal="gold" gradientUnits="userSpaceOnUse" spreadMethod="reflect" x1="0" y1="0" x2="260" y2="170">
        <stop offset="0" style="stop-color: var(--metal-shade)" stop-opacity="0"/>
        <stop offset=".08" style="stop-color: var(--metal-shade)" stop-opacity="0"/>
        <stop offset=".12" style="stop-color: var(--metal-shade)" stop-opacity=".9"/>
        <stop offset=".2" style="stop-color: var(--metal-shade)" stop-opacity=".35"/>
        <stop offset=".26" style="stop-color: var(--metal-shade)" stop-opacity="0"/>
        <stop offset=".38" style="stop-color: var(--metal-shade)" stop-opacity="0"/>
        <stop offset=".41" style="stop-color: var(--metal-shade)" stop-opacity="1"/>
        <stop offset=".44" style="stop-color: var(--metal-shade)" stop-opacity=".15"/>
        <stop offset=".5" style="stop-color: var(--metal-shade)" stop-opacity="0"/>
        <stop offset=".62" style="stop-color: var(--metal-shade)" stop-opacity="0"/>
        <stop offset=".67" style="stop-color: var(--metal-shade)" stop-opacity=".8"/>
        <stop offset=".74" style="stop-color: var(--metal-shade)" stop-opacity=".2"/>
        <stop offset=".8" style="stop-color: var(--metal-shade)" stop-opacity="0"/>
        <stop offset=".9" style="stop-color: var(--metal-shade)" stop-opacity="0"/>
        <stop offset=".93" style="stop-color: var(--metal-shade)" stop-opacity="1"/>
        <stop offset="1" style="stop-color: var(--metal-shade)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="edge-shade-red" gradientUnits="userSpaceOnUse" spreadMethod="reflect" x1="0" y1="0" x2="260" y2="170">
        <stop offset="0" style="stop-color: var(--red-shade)" stop-opacity="0"/>
        <stop offset=".08" style="stop-color: var(--red-shade)" stop-opacity="0"/>
        <stop offset=".12" style="stop-color: var(--red-shade)" stop-opacity=".9"/>
        <stop offset=".2" style="stop-color: var(--red-shade)" stop-opacity=".35"/>
        <stop offset=".26" style="stop-color: var(--red-shade)" stop-opacity="0"/>
        <stop offset=".38" style="stop-color: var(--red-shade)" stop-opacity="0"/>
        <stop offset=".41" style="stop-color: var(--red-shade)" stop-opacity="1"/>
        <stop offset=".44" style="stop-color: var(--red-shade)" stop-opacity=".15"/>
        <stop offset=".5" style="stop-color: var(--red-shade)" stop-opacity="0"/>
        <stop offset=".62" style="stop-color: var(--red-shade)" stop-opacity="0"/>
        <stop offset=".67" style="stop-color: var(--red-shade)" stop-opacity=".8"/>
        <stop offset=".74" style="stop-color: var(--red-shade)" stop-opacity=".2"/>
        <stop offset=".8" style="stop-color: var(--red-shade)" stop-opacity="0"/>
        <stop offset=".9" style="stop-color: var(--red-shade)" stop-opacity="0"/>
        <stop offset=".93" style="stop-color: var(--red-shade)" stop-opacity="1"/>
        <stop offset="1" style="stop-color: var(--red-shade)" stop-opacity="0"/>
      </linearGradient>

      <!-- The face of a screw head. Screws are always silver, whatever the metal of
           the frame, so these colours are the --screw tokens in tokens.css and
           not the --metal ones. The gradient is measured over the head, and the
           head turns with it. -->
      <linearGradient id="screw-face-silver" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" style="stop-color: var(--screw-light)"/>
        <stop offset=".45" style="stop-color: var(--screw-mid)"/>
        <stop offset="1" style="stop-color: var(--screw-dark)"/>
      </linearGradient>

      <!-- The logo's outline and stripes. The gradient is measured over the
           whole drawing (1100 x 884), so every plate and part carries on the same
           light: bright at the top left, dark lower down, then a hard bright band
           where the light catches, then dark again. The colours are the --metal
           tokens, so html[data-metal] recolours it. -->
      <linearGradient id="logo-metal" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="884">
        <stop offset="0" style="stop-color: var(--metal-1)"/>
        <stop offset=".3" style="stop-color: var(--metal-3)"/>
        <stop offset=".52" style="stop-color: var(--metal-4)"/>
        <stop offset=".56" style="stop-color: var(--metal-2)"/>
        <stop offset="1" style="stop-color: var(--metal-4)"/>
      </linearGradient>

      <!-- A screw is centred on 0,0. It is a slotted head, an octagon like the
           frame's own cut corners, with a dark slot straight across so that a
           turn can be seen. frame.css turns it and nothing else here moves. The
           shadow is the same octagon moved 5 right and 7 down, and is a shape of
           its own so a turning head never turns its shadow. The colours are set
           in base.css from the --screw tokens. -->
      <polygon id="screw-shadow-shape" points="-4,-15 14,-15 27,-2 27,16 14,29 -4,29 -17,16 -17,-2"/>
      <g id="screw-shape">
        <polygon class="screw-rim" points="-9,-22 9,-22 22,-9 22,9 9,22 -9,22 -22,9 -22,-9"/>
        <polygon class="screw-face" points="-8,-18 8,-18 18,-8 18,8 8,18 -8,18 -18,8 -18,-8"/>
        <polyline class="screw-ridge" points="-17,7 -17,-7 -8,-17 8,-17"/>
        <polygon class="screw-slot" points="-18,-3.5 18,-3.5 18,3.5 -18,3.5"/>
      </g>
      <!-- The silhouette shown for a person with no photo (core/portrait.js).
           It is a faceted, chamfered bust, drawn on the logo's own grid (see
           core/logo.js, 1100 x 884) so it belongs with the hawk. The head has
           the head plate's sides (x 430.5 to 669.5), its top (290.5) and the
           width of its column (478.5 to 621.5) at the chin (632). The neck is
           as wide as the jaw plate's top (498.5 to 601.5). The shoulders are
           as wide as the face plate (326.5 to 773.5), with the cut corners at
           45 degrees like the wing plates, and the two stripes are slashes like
           theirs. The view box shows the middle of the grid, so the shoulders
           run off the bottom. Every colour is a variable (--silhouette-... in
           tokens.css, which follow the theme), set by the classes in base.css. -->
      <symbol id="person-silhouette" viewBox="170 190 760 760">
        <polygon class="bust-light" points="478.5,290.5 550,290.5 550,632 478.5,632 430.5,520 430.5,350"/>
        <polygon class="bust-shade" points="550,290.5 621.5,290.5 669.5,350 669.5,520 621.5,632 550,632"/>
        <polygon class="bust-light" points="498.5,632 550,632 550,960 326.5,960 326.5,773.5 400,700 498.5,700"/>
        <polygon class="bust-shade" points="550,632 601.5,632 601.5,700 700,700 773.5,773.5 773.5,960 550,960"/>
        <polygon class="bust-cut" points="498.5,632 601.5,632 601.5,668 550,696 498.5,668"/>
        <polygon class="bust-cut" points="498.5,700 601.5,700 550,775"/>
        <polygon class="bust-slash" points="346,796 346,826 476,926 476,896"/>
        <polygon class="bust-slash" points="754,796 754,826 624,926 624,896"/>
      </symbol>

      <g id="metal-shapes"></g>
    </defs>
  </svg>

  <div id="screen">
    <div id="world">
      <!-- What shows behind the stage while a hidden transition has the screen
           apart (core/hidden-run.js, docs/hidden-transitions.md): black, the
           wallpaper, or the red eyes. It is empty and hidden until a transition
           plays, and it is before the stage so everything else covers it. -->
      <div id="backdrop" hidden></div>
      <div id="stage">
        <!-- The banner and the countdown draw themselves into their regions. The
             large panel, the small panel and the ticker each get an area, with
             its frame, the first time a page needs it (core/areas.js). The five
             regions marked data-block are the blocks that fly apart in a hidden
             transition. -->
        <div id="region-banner" data-block></div>
        <div id="region-grid1" data-block></div>
        <div id="region-right">
          <div id="region-countdown" data-block></div>
          <div id="region-grid2" data-block></div>
        </div>
        <div id="region-ticker" data-block></div>
      </div>
      <!-- The flat red layer of the red glitches. It is above the stage and hidden
           except while that transition plays. -->
      <div id="red-wash" hidden></div>
      <!-- The connection status text (core/connection.js): why Sanity cannot
           be reached, and the Mini's name and addresses (core/device.js), or
           the always-on text when Show connection status is switched on. Its
           lines are added by the script. It is after the stage, so it covers
           the corner of the screen while it is shown, and before the overlay,
           so a full screen alert still covers it. -->
      <div id="connection-status" hidden></div>
      <!-- The night screen, the screensaver (core/night-screen.js): black, with the
           logo and the team number. It is after the stage and the connection
           text, which it covers, and before the overlay, so an alert or an
           announcement still shows over it. It is empty and hidden until the
           script builds it. -->
      <div id="night" hidden></div>
      <div id="overlay"></div>
    </div>
    <div id="crt">
      <div class="lines"></div>
      <div class="bar"></div>
    </div>
  </div>

  <!-- If a core file fails to load, shell.js never runs and the screen would stay
       blank. This plain script waits 25 seconds, then says so and tries again. -->
  <script>
    setTimeout(function () {
      if (window.teletraanStarted) return;

      document.body.innerHTML = '<div style="width: 1920px; height: 1080px; display: flex; align-items: center; justify-content: center; background: #09060f; color: #faca2a; font: 700 96px/120px sans-serif; text-align: center;">Teletraan I could not start. Trying again in 30 seconds.</div>';
      setTimeout(function () { window.location.reload(); }, 30000);
    }, 25000);
  </script>
  <script type="module" src="shell.js"></script>
</body>
</html>
