# The name servers of the Teletraan computer, as desired state. computer/install.sh copies this file to
# /usr/local/etc/teletraan-network.conf, owned by root, only when that file is not there yet: edit that copy to change
# them. teletraan-net (computer/scripts/net-root.sh) reads three names from it and nothing else.
#
# A school network's own resolver can be slow or can block names the screen needs, so the screen uses these two.
# teletraan-dns.service applies them at boot and the installer applies them again; a Wi-Fi switch from the control page
# gives the new network the same servers. netwatch.sh falls back to the network's own servers when these stop answering
# and goes back to these when they answer again (docs/OPERATIONS.md, Name servers).
DNS_PRIMARY=8.8.8.8
DNS_SECONDARY=8.8.4.4
# yes: the screen's name servers are kept on the connection. no: the network's own are left alone.
DNS_ENFORCE=yes
