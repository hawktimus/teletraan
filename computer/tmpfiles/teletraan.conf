# The folders the Teletraan services need at boot. install-sync.sh copies this file to /etc/tmpfiles.d/teletraan.conf and puts
# the login user in place of ACCOUNT and the data folder in place of DATA. Without them the web container, which mounts the
# data folder and may not create it, would refuse to start and the screen would be black (docs/audit.md, Part B).
d /var/log/teletraan 0755 ACCOUNT ACCOUNT -
d DATA 0755 ACCOUNT ACCOUNT -
d DATA/live 0755 ACCOUNT ACCOUNT -
d /var/lib/teletraan 0755 ACCOUNT ACCOUNT -
