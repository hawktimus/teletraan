<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Teletraan I</title>
  <style>
    /* The colors of the control page (control/static/style.css and tabs/tabs.css) */
    @font-face { font-family: 'Tomorrow'; font-weight: 700; src: url('/control/fonts/tomorrow-700.woff2') format('woff2'); }
    :root { --purple: #6c18b6; --yellow: #faca2a; --paper: #0b0714; --card: #1a1228; --edge: #3a2c55; --text: #f3eefc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: var(--paper); color: var(--text); font: 20px/1.4 'Tomorrow', system-ui, sans-serif; }
    html { -webkit-text-size-adjust: 100%; }
    main { width: 100%; max-width: 560px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 28px; color: var(--yellow); }
    p { margin: 0 0 24px; color: #b9afcf; }
    a { display: flex; align-items: center; justify-content: center; min-height: 96px; margin-bottom: 16px; border: 2px solid var(--edge); border-radius: 8px; background: var(--card); color: var(--text); font-size: 28px; font-weight: 700; text-decoration: none; text-align: center; overflow-wrap: anywhere; }
    a.first { border-color: var(--yellow); background: var(--yellow); color: #1a1228; }
    a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Teletraan I</h1>
    <p>Pick where to go.</p>
    <a class="first" href="/control/">Control page</a>
    <a href="/studio/">Studio</a>
  </main>
</body>
</html>
