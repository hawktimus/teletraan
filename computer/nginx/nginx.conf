# Settings for the web server inside the container. It serves the dashboard
# folder and nothing else.

user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 64;
}

http {
  # Every type the dashboard uses is listed here, so nothing depends on the
  # list that comes with the image. Add a line when you add a new kind of file.
  default_type application/octet-stream;
  types {
    text/html html;
    text/css css;
    text/javascript js mjs;
    application/json json;
    text/calendar ics;
    text/plain txt;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    image/webp webp;
    image/gif gif;
    image/x-icon ico;
    font/woff2 woff2;
  }

  server_tokens off;
  autoindex off;
  access_log off;

  # Relative redirects, so the port in the address bar never matters
  absolute_redirect off;

  # A zip pushed from the control page is at most 100 MB
  client_max_body_size 110m;

  # The control service is a container; its name is looked up when a request comes, so this server
  # starts even while the service is stopped.
  resolver 127.0.0.11 valid=10s;

  # What the browser may keep. Pages, scripts and stylesheets are no-cache:
  # the browser keeps a copy but asks with its ETag before each use, which is
  # cheap on this machine. This is on purpose not a week of max-age: the
  # modules a script imports (./core/x.js) have their own addresses, and a
  # ?v= on the entry script does not reach them, so a long max-age would leave
  # old code running after an update. Images and fonts rarely change and are
  # kept for a week. The live data (json, calendars, version.txt) is never kept.
  map $uri $cache_control {
    default "no-store";
    # The picture of the TV changes many times a second, so it is listed before the images
    ~^/mirror/ "no-store";
    ~\.(html|js|mjs|css)$ "no-cache";
    ~/$ "no-cache";
    ~\.(png|jpe?g|webp|gif|svg|ico|woff2)$ "max-age=604800";
  }

  # A location that sets its own add_header would drop this one, so keep it here.
  add_header Cache-Control $cache_control always;
  # A file is only ever read as the kind it is named, and a link out of the page tells the other site nothing
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  server {
    listen 80 default_server;
    server_name _;
    root /srv/web;
    index index.html;

    # Files and folders that start with a dot are never served
    location ~ /\. {
      return 404;
    }

    location = / {
      return 302 /dashboard/;
    }

    # The control page and its calls. This server is published on 127.0.0.1 only, so every request here comes
    # from this computer. Docker would show the address of its bridge, so X-Real-IP is set to the plain loopback
    # address, which is what the route of the dashboard's report (POST /control/api/now) accepts.
    location /control/ {
      set $control http://control:3230;
      proxy_pass $control;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP 127.0.0.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # The Studio built on the Teletraan computer (control/lib/studio-build.js)
    location /studio/ {
      try_files $uri $uri/ /studio/index.html;
    }

    # The slides of a talk: a manifest.json and the pictures next to it, made
    # by computer/scripts/slides-sync.sh. The manifest may be kept for a few
    # seconds. The pictures are never kept, like everything else here.
    location ~ ^/dashboard/data/live/slides/[^/]+/manifest\.json$ {
      add_header Cache-Control "max-age=10" always;
    }

    # The Google Drive photos: the manifest is read often and may be kept a few seconds. The pictures
    # have the id of the Drive file in their name, and the screen adds the change time to the address.
    location = /dashboard/data/live/photos/manifest.json {
      add_header Cache-Control "max-age=10" always;
    }

    # The Match13 forecasts (computer/scripts/match13-sync.sh): one small file, rewritten every 30 minutes at most
    location = /dashboard/data/live/match13.json {
      add_header Cache-Control "max-age=60" always;
    }
  }

  # The landing page, the control page, the Studio and a read only copy of the dashboard for the WiFi and for
  # Tailscale. The dashboard is public data, so this shows nothing the Sanity dataset does not. The Now showing tab
  # of the control page draws it in a small frame. The report of the dashboard to the control page still comes from
  # this computer only (see below), so a copy on a phone never claims to be the wall.
  server {
    listen 3229;
    server_name _;
    root /srv/web;
    index index.html;

    location ~ /\. {
      return 404;
    }

    # Two big buttons: the control page and the Studio (computer/nginx/landing.html)
    location = / {
      root /srv/landing;
      try_files /index.html =404;
    }

    location /control/ {
      set $control http://control:3230;
      proxy_pass $control;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # The dashboard's own report is accepted from this computer only (the server above): nothing but GET passes here
    location = /control/api/now {
      limit_except GET {
        deny all;
      }
      set $control http://control:3230;
      proxy_pass $control;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /studio/ {
      try_files $uri $uri/ /studio/index.html;
    }

    # The same manifest rule as the server above, for the slides in the copy of the dashboard
    location ~ ^/dashboard/data/live/slides/[^/]+/manifest\.json$ {
      add_header Cache-Control "max-age=10" always;
    }

    # The Google Drive photos: the manifest is read often and may be kept a few seconds. The pictures
    # have the id of the Drive file in their name, and the screen adds the change time to the address.
    location = /dashboard/data/live/photos/manifest.json {
      add_header Cache-Control "max-age=10" always;
    }

    # The Match13 forecasts (computer/scripts/match13-sync.sh): one small file, rewritten every 30 minutes at most
    location = /dashboard/data/live/match13.json {
      add_header Cache-Control "max-age=60" always;
    }

    # The moving picture of the TV for the Live preview (computer/scripts/mirror.py). Only the picture and its counter are
    # served, read only, from the data folder that is already mounted above. The picture is the screen and nothing else.
    location = /mirror/frame.jpg {
      alias /srv/web/dashboard/data/live/mirror/frame.jpg;
      default_type image/jpeg;
    }
    location = /mirror/frame.n {
      alias /srv/web/dashboard/data/live/mirror/frame.n;
      default_type text/plain;
    }
  }

  # Port 3426 opens the Studio and nothing else
  server {
    listen 3426;
    server_name _;
    root /srv/web;

    location ~ /\. {
      return 404;
    }

    location = / {
      return 302 /studio/;
    }

    location /studio/ {
      try_files $uri $uri/ /studio/index.html;
    }
  }
}
