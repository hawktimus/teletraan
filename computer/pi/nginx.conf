# The web server of the Raspberry Pi copy (computer/pi/README.md). It is computer/nginx/nginx.conf without Docker:
# the dashboard on this computer only, on port 8080. The page reads data/live through a link to /var/lib/teletraan/data.
worker_processes 1;
pid /run/teletraan-web/nginx.pid;
events {
  worker_connections 64;
}
http {
  default_type application/octet-stream;
  types {
    text/html html;
    text/css css;
    text/javascript js mjs;
    application/json json;
    text/calendar ics;
    text/plain txt;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    image/webp webp;
    image/gif gif;
    image/x-icon ico;
    font/woff2 woff2;
  }
  server_tokens off;
  autoindex off;
  access_log off;
  absolute_redirect off;
  client_body_temp_path /run/teletraan-web/body;
  proxy_temp_path /run/teletraan-web/proxy;
  fastcgi_temp_path /run/teletraan-web/fastcgi;
  uwsgi_temp_path /run/teletraan-web/uwsgi;
  scgi_temp_path /run/teletraan-web/scgi;

  map $uri $cache_control {
    default "no-store";
    ~\.(html|js|mjs|css)$ "no-cache";
    ~/$ "no-cache";
    ~\.(png|jpe?g|webp|gif|svg|ico|woff2)$ "max-age=604800";
  }
  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    root /opt/teletraan/web;
    index index.html;
    location ~ /\. {
      return 404;
    }
    location = / {
      return 302 /dashboard/;
    }
    # The control page of this copy and its calls (systemd/teletraan-pi-control.service). Every request here comes
    # from this computer, which is what the route of the dashboard's report (POST /control/api/now) accepts.
    location /control/ {
      proxy_pass http://127.0.0.1:3230;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP 127.0.0.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
    }

    # The home screen of the console (computer/pi/launcher). It is part of this folder and not of the dashboard, which
    # is also the program of the Teletraan computer at school.
    location /launcher/ {
      alias /opt/teletraan/current/computer/pi/launcher/;
    }

    # Meeting, the presentations of the Pi: its page, and the list and pictures that meeting-sync.sh keeps (all read only)
    location /meeting/ {
      alias /opt/teletraan/current/computer/pi/meeting/;
    }
    location /meeting-data/ {
      alias /var/lib/teletraan/meeting/;
    }

    # What the dashboard asks of the exit watcher: to leave, to note which page is up, and what the home screen chose (exit-watch.py)
    location /pi/ {
      proxy_pass http://127.0.0.1:8079/;
    }

    location ~ ^/dashboard/data/live/slides/[^/]+/manifest\.json$ {
      add_header Cache-Control "max-age=10" always;
    }
    location = /dashboard/data/live/photos/manifest.json {
      add_header Cache-Control "max-age=10" always;
    }
    location = /dashboard/data/live/match13.json {
      add_header Cache-Control "max-age=60" always;
    }
  }
}
