# Settings for the web server inside the container. It serves the dashboard
# folder and nothing else.

user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 64;
}

http {
  # Every type the dashboard uses is listed here, so nothing depends on the
  # list that comes with the image. Add a line when you add a new kind of file.
  default_type application/octet-stream;
  types {
    text/html html;
    text/css css;
    text/javascript js mjs;
    application/json json;
    text/calendar ics;
    text/plain txt;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    image/webp webp;
    image/gif gif;
    image/x-icon ico;
    font/woff2 woff2;
  }

  server_tokens off;
  autoindex off;
  access_log off;

  # Relative redirects, so the port in the address bar never matters
  absolute_redirect off;

  # A refresh must always show the newest files. A location that sets its own
  # add_header would drop this one, so keep it here.
  add_header Cache-Control "no-store" always;

  server {
    listen 80 default_server;
    server_name _;
    root /srv/web;
    index index.html;

    # Files and folders that start with a dot are never served
    location ~ /\. {
      return 404;
    }

    location = / {
      return 302 /dashboard/;
    }
  }
}
